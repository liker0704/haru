description: "Stage E pr-ci-failure: CI fails twice then passes, debugger dispatched on failure"
timeout_ms: 600000

config_overrides:
  pr:
    operatorGithubLogin: operator
    ciTimeoutMs: 120000
    mergeStrategy: squash

startup_actions:
  - command: mkdir -p /tmp/haru-eval-pr-ci-failure
    description: "Create eval state dir with check_counter for gh mock; PATH=repo-template/bin:$PATH and HARU_EVAL_STATE_DIR must be set before coordinator start"
  - command: sd create --title "PR CI failure eval task" --type task
    description: "Create task to trigger pr-tier mission"
