services:
  haru:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haru
    stdin_open: true
    tty: true
    volumes:
      # Project source code (the repo being worked on)
      - ${PROJECT_PATH:-.}:/workspace
      # Claude Code config (agent definitions, commands, settings)
      - ${CLAUDE_CONFIG:-~/.claude}:/root/.claude
      # Persistent haru data (SQLite DBs, sessions, mail)
      - haru-data:/workspace/.overstory
      # Git config (read-only)
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - GITHUB_TOKEN
      - HARU_LOG_LEVEL=${HARU_LOG_LEVEL:-info}
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  haru-data:
